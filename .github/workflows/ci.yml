name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly, so that a Chromium or dependency change that breaks the browser suite is noticed without a commit.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seal:
    name: seal (Node 22, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser suite
        run: npx playwright-core install --with-deps chromium

      - name: Verify the source manifest
        run: npm run manifest:verify

      - name: Static checks
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
